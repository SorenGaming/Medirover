# Include inside the existing HTTPS server block.
# Read-only pages and data.
location ~ ^/($|static/|api/(statistics|temperature)$) {
    limit_except GET {
        deny all;
    }
    proxy_pass http://127.0.0.1:8000;
}
# Orders and the trip buttons (Bestil, Pakket, Stop, Fortsaet, Afslut).
location ~ ^/api/orders(/[0-9a-f-]{36}/(packed|stop|resume|close))?$ {
    limit_except GET POST {
        deny all;
    }
    proxy_pass http://127.0.0.1:8000;
}
