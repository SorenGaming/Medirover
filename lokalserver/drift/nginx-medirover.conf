# Medtag filen i det eksisterende HTTPS-serverafsnit.
location ~ ^/($|static/|api/(statistics|temperature)$) {
    limit_except GET {
        deny all;
    }
    proxy_pass http://127.0.0.1:8000;
}
# Citattegn bevarer regexens {36} i nginx-konfigurationen.
location ~ "^/api/orders(/[0-9a-f-]{36}/(packed|stop|resume|close))?$" {
    limit_except GET POST {
        deny all;
    }
    proxy_pass http://127.0.0.1:8000;
}
